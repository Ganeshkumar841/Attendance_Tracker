<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AttendX — Event Attendance System</title>

  <!-- External Libraries: SheetJS & Supabase Client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&family=Google+Sans+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN & Custom Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="frontend/styles/tailwind.config.js?v=2.1"></script>
  <link rel="stylesheet" href="frontend/styles/theme.css?v=2.1">
</head>
<body class="font-sans bg-app text-main min-h-screen overflow-x-hidden flex flex-col transition-colors duration-200 select-none">

  <!-- GLOBAL HEADER COMPONENT MOUNT -->
  <div id="app-header-mount"></div>

  <!-- MAIN APPLICATION WORKSPACE -->
  <main id="app" class="relative z-[1] flex-1 flex flex-col">
    <div id="page-signin-mount" class="flex-1 flex flex-col"></div>
    <div id="page-menu-mount" class="flex-1 flex flex-col"></div>
    <div id="page-events-mount" class="flex-1 flex flex-col"></div>
    <div id="page-attendance-mount" class="flex-1 flex flex-col"></div>
  </main>

  <!-- GLOBAL FOOTER COMPONENT MOUNT -->
  <div id="app-footer-mount"></div>

  <!-- MODALS MOUNT -->
  <div id="app-modals-mount"></div>

  <!-- TOAST NOTIFICATION -->
  <div
    id="toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-[95px] bg-surface border border-strong text-main py-2.5 px-5 rounded-full text-[0.85rem] font-medium shadow-toast transition-transform duration-300 z-[1000] whitespace-nowrap pointer-events-none"
  ></div>

  <!-- Environment Configuration -->
  <script src="config.js?v=2.1"></script>

  <!-- Backend Layer (Config, Middleware & Services) -->
  <script src="backend/config/securityConfig.js?v=2.1"></script>
  <script src="backend/config/supabaseClient.js?v=2.1"></script>
  <script src="backend/middleware/rateLimiter.js?v=2.1"></script>
  <script src="backend/middleware/sessionManager.js?v=2.1"></script>
  <script src="backend/services/auditService.js?v=2.1"></script>
  <script src="backend/services/authService.js?v=2.1"></script>
  <script src="backend/services/eventService.js?v=2.1"></script>
  <script src="backend/services/attendanceService.js?v=2.1"></script>

  <!-- Frontend Layer (Utilities, Components, Pages & App Router) -->
  <script src="frontend/utils/sanitizer.js?v=2.1"></script>
  <script src="frontend/utils/theme.js?v=2.1"></script>
  <script src="frontend/utils/exporter.js?v=2.1"></script>
  <script src="frontend/components/header.js?v=2.1"></script>
  <script src="frontend/components/footer.js?v=2.1"></script>
  <script src="frontend/components/modals.js?v=2.1"></script>
  <script src="frontend/components/toast.js?v=2.1"></script>
  <script src="frontend/pages/signin.js?v=2.1"></script>
  <script src="frontend/pages/menu.js?v=2.1"></script>
  <script src="frontend/pages/events.js?v=2.1"></script>
  <script src="frontend/pages/viewList.js?v=2.1"></script>
  <script src="frontend/pages/exportPage.js?v=2.1"></script>
  <script src="frontend/pages/attendance.js?v=2.1"></script>
  <script src="frontend/app.js?v=2.1"></script>
</body>
</html>
