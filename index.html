<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AttendX</title>

  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('attendx_theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (_e) {}
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="frontend/styles/tailwind.config.js?v=2.4"></script>
  <link rel="stylesheet" href="frontend/styles/theme.css?v=2.4">
</head>
<body class="font-sans bg-app text-main min-h-screen overflow-x-hidden flex flex-col select-none">
  <div id="app-header-mount"></div>

  <main id="app" class="relative z-[1] flex-1 flex flex-col">
    <div id="page-signin-mount" class="flex-1 flex flex-col"></div>
    <div id="page-menu-mount" class="flex-1 flex flex-col"></div>
    <div id="page-events-mount" class="flex-1 flex flex-col"></div>
    <div id="page-attendance-mount" class="flex-1 flex flex-col"></div>
  </main>

  <div id="app-footer-mount"></div>
  <div id="app-modals-mount"></div>

  <div
    id="toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-[95px] bg-surface border border-strong text-main py-2.5 px-5 rounded-xl text-[0.85rem] font-medium shadow-toast transition-transform duration-300 z-[1000] whitespace-nowrap pointer-events-none"
  ></div>

  <script src="config.js?v=2.4"></script>

  <script src="backend/config/securityConfig.js?v=2.4"></script>
  <script src="backend/config/supabaseClient.js?v=2.4"></script>
  <script src="backend/middleware/rateLimiter.js?v=2.4"></script>
  <script src="backend/middleware/sessionManager.js?v=2.4"></script>
  <script src="backend/services/auditService.js?v=2.4"></script>
  <script src="backend/services/authService.js?v=2.4"></script>
  <script src="backend/services/eventService.js?v=2.4"></script>
  <script src="backend/services/attendanceService.js?v=2.4"></script>

  <script src="frontend/utils/sanitizer.js?v=2.4"></script>
  <script src="frontend/utils/theme.js?v=2.4"></script>
  <script src="frontend/utils/exporter.js?v=2.4"></script>
  <script src="frontend/components/header.js?v=2.4"></script>
  <script src="frontend/components/footer.js?v=2.4"></script>
  <script src="frontend/components/modals.js?v=2.4"></script>
  <script src="frontend/components/toast.js?v=2.4"></script>
  <script src="frontend/pages/signin.js?v=2.4"></script>
  <script src="frontend/pages/menu.js?v=2.4"></script>
  <script src="frontend/pages/events.js?v=2.4"></script>
  <script src="frontend/pages/viewList.js?v=2.4"></script>
  <script src="frontend/pages/exportPage.js?v=2.4"></script>
  <script src="frontend/pages/attendance.js?v=2.4"></script>
  <script src="frontend/app.js?v=2.4"></script>
</body>
</html>
